services:
  gameoptengine:
    build:
      context: .
      dockerfile: Dockerfile
    image: gameoptengine:local
    restart: unless-stopped
    environment:
      GAMEOPTENGINE_ACTIVITY_LOG_PATH: /var/lib/gameoptengine/activity.jsonl
      GAMEOPTENGINE_ACTIVITY_VIEWER_PREFIX: http://0.0.0.0:5088/
    ports:
      - "127.0.0.1:5088:5088"
    volumes:
      - gameoptengine-activity:/var/lib/gameoptengine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

volumes:
  gameoptengine-activity:
